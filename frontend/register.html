<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora — Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            NEXORA
        </a>

    </div>

</header>


<main>

    <section class="auth-page">

        <div class="auth-card">

            <span class="section-label">
                NEXORA ACCOUNT
            </span>

            <h1>
                Create account
            </h1>

            <p class="auth-subtitle">
                Create your account to start shopping.
            </p>


           <form id="register-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        minlength="3"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        minlength="8"
                        required
                    >

                </div>


                <div
                    id="register-error"
                    class="form-error"
                ></div>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Create account
                </button>

            </form>
            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>

</html>

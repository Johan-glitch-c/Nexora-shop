<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora — Account</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header class="header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            NEXORA
        </a>

        <nav class="nav">

            <a
                href="index.html"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="catalog.html"
                class="nav-link"
            >
                Catalog
            </a>

        </nav>

        <div class="header-actions">

            <a
                href="cart.html"
                class="cart-btn"
            >
                Cart
                <span class="cart-count">0</span>
            </a>

        </div>

    </div>

</header>


<main>

    <section class="account-page section">

        <div class="container">

            <div class="account-card">

                <span class="section-label">
                    NEXORA ACCOUNT
                </span>

                <h1>
                    My account
                </h1>


                <div
                    id="account-content"
                    class="account-content"
                >

                    <div class="loading">
                        Loading account...
                    </div>

                </div>


                <!-- ORDER HISTORY -->

                <div
                    id="orders-section"
                    class="orders-section"
                >

                    <div class="orders-heading">

                        <span class="section-label">
                            ORDER HISTORY
                        </span>

                        <h2>
                            My Orders
                        </h2>

                    </div>


                    <div
                        id="orders-content"
                        class="orders-content"
                    >

                        <div class="loading">
                            Loading orders...
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container footer-inner">

        <div>

            <a
                href="index.html"
                class="logo"
            >
                NEXORA
            </a>

            <p>
                Modern technology for modern life.
            </p>

        </div>

    </div>

</footer>


<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/account.js"></script>

</body>

</html>

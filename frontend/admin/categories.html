<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora — Admin Categories</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

</head>

<body>

<header class="admin-header">

    <div class="admin-container admin-header-inner">

        <a
            href="index.html"
            class="admin-logo"
        >
            NEXORA
            <span>ADMIN</span>
        </a>

        <div class="admin-header-actions">

            <a
                href="index.html"
                class="admin-link"
            >
                Dashboard
            </a>

            <a
                href="products.html"
                class="admin-link"
            >
                Products
            </a>

            <a
                href="../index.html"
                class="admin-link"
            >
                Store
            </a>

            <button
                type="button"
                id="logout-button"
                class="admin-logout"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="admin-main">

    <div class="admin-container">

        <section class="admin-page-header">

            <div>

                <span class="admin-label">
                    MANAGEMENT
                </span>

                <h1>
                    Categories
                </h1>

                <p>
                    Manage your store categories.
                </p>

            </div>


            <button
                type="button"
                class="admin-primary-button"
                id="add-category-button"
            >
                + Add category
            </button>

        </section>


        <section class="admin-table-wrapper">

            <div
                id="categories-list"
                class="admin-products-list"
            >

                <div class="admin-loading">
                    Loading categories...
                </div>

            </div>

        </section>

    </div>

</main>


<!-- CATEGORY MODAL -->

<div
    id="category-modal"
    class="admin-modal hidden"
>

    <div class="admin-modal-content">

        <div class="admin-modal-header">

            <div>

                <span
                    id="modal-label"
                    class="admin-label"
                >
                    NEW CATEGORY
                </span>

                <h2 id="modal-title">
                    Add category
                </h2>

            </div>


            <button
                type="button"
                id="close-modal"
                class="admin-modal-close"
            >
                ×
            </button>

        </div>


        <form id="category-form">

            <input
                type="hidden"
                id="category-id"
            >


            <div class="admin-form-group">

                <label for="category-name">
                    Name
                </label>

                <input
                    id="category-name"
                    type="text"
                    minlength="5"
                    maxlength="100"
                    required
                >

            </div>


            <div class="admin-form-group">

                <label for="category-slug">
                    Slug
                </label>

                <input
                    id="category-slug"
                    type="text"
                    minlength="5"
                    maxlength="100"
                    required
                >

            </div>


            <div
                id="category-form-error"
                class="admin-form-error"
            ></div>


            <div class="admin-modal-actions">

                <button
                    type="button"
                    id="cancel-category"
                    class="admin-secondary-button"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="admin-primary-button"
                >
                    Save category
                </button>

            </div>

        </form>

    </div>

</div>


<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="js/admin.js"></script>
<script src="js/categories.js"></script>


<script>

document
    .getElementById("logout-button")
    .addEventListener(
        "click",
        logout
    );

</script>

</body>

</html>

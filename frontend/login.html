<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora — Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<header class="header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            NEXORA
        </a>

        <nav class="nav">

            <a
                href="index.html"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="catalog.html"
                class="nav-link"
            >
                Catalog
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="auth-page">

        <div class="auth-card">

            <span class="section-label">
                WELCOME BACK
            </span>

            <h1>
                Sign in
            </h1>

            <p class="auth-subtitle">
                Login to your Nexora account.
            </p>


            <form id="login-form">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        required
                    >

                </div>


                <div
                    id="login-error"
                    class="form-error"
                ></div>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>
<script src="js/api.js"></script>

<script>

const form =
    document.getElementById(
        "login-form"
    );


const errorElement =
    document.getElementById(
        "login-error"
    );


form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        errorElement.textContent = "";


        const username =
            document.getElementById(
                "username"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        try {

            const response =
                await loginUser({
                    username,
                    password,
                });


            saveToken(
                response.access_token
            );


            window.location.href =
                "index.html";

        } catch (error) {

            errorElement.textContent =
                error.message;
        }

    }
);

</script>

</body>

</html>

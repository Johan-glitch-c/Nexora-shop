<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexora — Cart</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>


<header class="header">

    <div class="container header-inner">

        <a
            href="index.html"
            class="logo"
        >
            NEXORA
        </a>


        <nav class="nav">

            <a
                href="index.html"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="catalog.html"
                class="nav-link"
            >
                Catalog
            </a>

        </nav>


        <div class="header-actions">

            <a
                href="cart.html"
                class="cart-btn"
            >
                Cart

                <span class="cart-count">
                    0
                </span>
            </a>

        </div>

    </div>

</header>


<main>

    <section class="cart-page section">

        <div class="container">

            <div class="section-heading">

                <div>

                    <span class="section-label">
                        YOUR SHOPPING
                    </span>

                    <h1>
                        Shopping cart
                    </h1>

                </div>

            </div>


            <div
                class="cart-layout"
                id="cart-layout"
            >

                <div
                    class="cart-items"
                    id="cart-items"
                >
                </div>


                <aside
                    class="cart-summary"
                    id="cart-summary"
                >
                </aside>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container footer-inner">

        <div>

            <a
                href="index.html"
                class="logo"
            >
                NEXORA
            </a>

            <p>
                Modern technology for modern life.
            </p>

        </div>

    </div>

</footer>


<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/cart.js"></script>

</body>

</html>
